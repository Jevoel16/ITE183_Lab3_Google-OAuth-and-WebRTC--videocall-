<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jmeet</title>
    <!-- Applies the saved theme before first paint so there's no flash -->
    <script>try { var t = localStorage.getItem("jmeet.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 -4 40 40'><path fill='%2315bcca' d='M0 8 8 0v8z'/><path fill='%23bd7a0b' d='M0 8h8v16H0z'/><path fill='%23cb57ac' d='M0 24h8v8H2a2 2 0 0 1-2-2z'/><path fill='%230443fa' d='M8 0h18a2 2 0 0 1 2 2v6H8z'/><path fill='%23cb57ac' d='M8 24h20v6a2 2 0 0 1-2 2H8zM20 8h8v16h-8zM28 12l10-8v24l-10-8z'/></svg>">
    <link rel="stylesheet" href="/style.css">
    <!-- Google OAuth client ID, GitHub helper URL, TURN servers (copy public/config.example.js to public/config.js) -->
    <script src="/config.js"></script>
    <script src="/jmeet-core.js"></script>
    <!-- Google Identity Services (Sign in with Google) -->
    <script id="gsiScript" src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
    <!-- ==================== JOIN SCREEN ==================== -->
    <main id="joinScreen">
        <div id="topBar">
            <span class="brand" id="brand"></span>
            <div class="theme-picker" role="group" aria-label="Theme">
                <button type="button" data-theme-choice="system" aria-label="System" title="System" aria-pressed="true">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
                </button>
                <button type="button" data-theme-choice="light" aria-label="Light" title="Light" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>
                <button type="button" data-theme-choice="dark" aria-label="Dark" title="Dark" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                </button>
            </div>
        </div>
        <div id="previewWrap">
            <video id="previewVideo" autoplay playsinline muted></video>
            <div id="previewMsg" class="hidden"></div>
            <div id="previewControls">
                <button class="ctrl" id="previewMicBtn" type="button" title="Turn off microphone"></button>
                <button class="ctrl" id="previewCamBtn" type="button" title="Turn off camera"></button>
            </div>
        </div>
        <div id="joinBox">
            <h1>Ready to join?</h1>
            <p id="connStatus" role="status">Connecting to server...</p>
            <div id="roomBox">
                <label for="roomInput">Room code</label>
                <div class="room-row">
                    <input type="text" id="roomInput" placeholder="abc-defg-hij" autocomplete="off"
                           spellcheck="false" autocapitalize="none" maxlength="80" aria-invalid="false" />
                    <button type="button" id="newRoomBtn" class="text-btn">New room</button>
                </div>
                <p id="roomError" class="hidden">Enter a room code like abc-defg-hij, or make a new room.</p>
            </div>
            <div id="authBox">
                <p id="authMsg">Sign in with Google or GitHub to join.</p>
                <div id="googleBtn"></div>
                <a id="githubBtn" class="gh-btn hidden" href="#">
                    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
                    Sign in with GitHub
                </a>
                <div id="userChip" class="hidden">
                    <img id="userPic" alt="" referrerpolicy="no-referrer" />
                    <div id="userText">
                        <b id="userName"></b>
                        <span id="userEmail"></span>
                    </div>
                    <button id="signOutBtn" type="button">Sign out</button>
                </div>
            </div>
            <button id="joinBtn" class="pill-btn" disabled>Join now</button>
        </div>
    </main>
    <footer class="site-footer" id="siteFooter">
        <p><span>Built by <a href="https://github.com/Jevoel16">Sprucetrap</a>.</span> <a href="https://github.com/Jevoel16/ITE183_Lab3_Google-OAuth-and-WebRTC--videocall-/blob/main/LICENSE">License</a></p>
    </footer>

    <!-- ==================== CALL SCREEN ==================== -->
    <div id="callScreen" class="hidden">
        <div id="stage">
            <div id="grid"></div>
        </div>

        <aside id="chatPanel" class="hidden">
            <div id="chatHeader">
                <span>In-call messages</span>
                <button id="chatClose" title="Close">&times;</button>
            </div>
            <div id="chatNote">Only people in this room see these messages, and they're gone when the call ends.</div>
            <div id="chatLog"></div>
            <form id="chatForm" autocomplete="off">
                <input type="text" id="chatInput" placeholder="Send a message" aria-label="Message" maxlength="500" />
                <button type="submit" id="chatSend" title="Send" disabled>
                    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
                </button>
            </form>
        </aside>

        <div id="controls">
            <div id="roomInfo">
                <b id="clock"></b> <span>|</span> <span id="roomCode"></span>
                <button type="button" id="copyLinkBtn" class="text-btn">Copy link</button>
            </div>
            <div id="centerBtns">
                <button class="ctrl" id="micBtn" title="Turn off microphone"></button>
                <button class="ctrl" id="camBtn" title="Turn off camera"></button>
                <button class="ctrl" id="shareBtn" title="Present now"></button>
                <button class="ctrl leave" id="leaveBtn" title="Leave call"></button>
            </div>
            <div id="rightBtns">
                <button class="ctrl" id="chatBtn" title="Chat with everyone"></button>
            </div>
        </div>
    </div>

    <button type="button" id="audioUnlock" class="pill-btn hidden">Tap to hear the call</button>
    <div id="toast" role="status" aria-live="polite"></div>

    <script>
        // ==============================
        // ICONS
        // ==============================
        const ICONS = {
            logo: '<svg viewBox="0 0 40 32"><path class="logo-b" d="M0 8 8 0v8z"/><path class="logo-a" d="M0 8h8v16H0z"/><path class="logo-d" d="M0 24h8v8H2a2 2 0 0 1-2-2z"/><path class="logo-c" d="M8 0h18a2 2 0 0 1 2 2v6H8z"/><path class="logo-d" d="M8 24h20v6a2 2 0 0 1-2 2H8zM20 8h8v16h-8zM28 12l10-8v24l-10-8z"/></svg>',
            micOn: '<svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>',
            micOff: '<svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5a3 3 0 0 0-6 0v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52a5 5 0 0 1-5-5H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>',
            camOn: '<svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>',
            camOff: '<svg viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7a1 1 0 0 0-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z"/></svg>',
            share: '<svg viewBox="0 0 24 24"><path d="M20 18a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2H0v2h24v-2h-4zM4 6h16v10H4V6zm9 7.5V15l3-3-3-3v1.5c-3 .4-4.3 2.4-5 4.5 1.1-1.4 2.6-2 5-2z"/></svg>',
            leave: '<svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a.98.98 0 0 1-.7.28.99.99 0 0 1-.71-.29L.29 13.08A.96.96 0 0 1 0 12.37c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48a.99.99 0 0 1-.71.29.98.98 0 0 1-.7-.28 11.27 11.27 0 0 0-2.67-1.85.99.99 0 0 1-.56-.9v-3.1A15.9 15.9 0 0 0 12 9z"/></svg>',
            chat: '<svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H5.17L4 17.17V4h16v12zM7 9h10v2H7zm0-3h10v2H7zm0 6h7v2H7z"/></svg>',
            micOffSmall: '<svg viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5a3 3 0 0 0-6 0v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52a5 5 0 0 1-5-5H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>'
        };

        // ==============================
        // STATE
        // ==============================
        const Core = window.JmeetCore;
        const CONFIG = window.JMEET_CONFIG || {};
        const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + (location.host || "localhost:8000");
        // STUN finds a direct path; across different networks (mobile data vs
        // home Wi-Fi) that path often fails or only works one way, so a TURN
        // relay from config.js is used as the fallback.
        const RTC_CONFIG = {
            iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
                .concat(Array.isArray(CONFIG.iceServers) ? CONFIG.iceServers : [])
        };
        const PING_MS = 25000;       // under Cloudflare's ~100 s idle limit
        const PONG_TIMEOUT_MS = 60000;

        let socket = null;
        let conn = Core.CONN.CONNECTING;
        let reconnectAttempt = 0;
        let pingTimer = null;
        let lastPong = 0;
        let myId = null;
        let myName = "";
        let myPicture = "";
        let auth = { status: Core.AUTH.SIGNED_OUT }; // see docs/state-machines.md
        let room = "";
        let inCall = false;
        let signalQueue = Promise.resolve();
        let localStream = null;   // camera + mic
        let screenStream = null;  // screen share (when presenting)
        let audioOn = true;
        let videoOn = true;
        let unread = false;

        // peerId -> { pc, name, tile, pendingIce: [], audio, video }
        const peers = {};

        const $ = (id) => document.getElementById(id);

        // ==============================
        // HELPERS
        // ==============================
        function toast(text) {
            const t = $("toast");
            t.textContent = text;
            t.classList.add("show");
            clearTimeout(toast.timer);
            toast.timer = setTimeout(() => t.classList.remove("show"), 2500);
        }

        // The native http.dll crashes on WebSocket frames of roughly 8 KB+,
        // and WebRTC offers/answers are often bigger than that, so large
        // messages are split into small "chunk" messages and reassembled.
        const CHUNK_SIZE = 3000;
        const incomingChunks = {}; // "from:cid" -> { parts: [], received }

        function send(obj) {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            obj.from = myId;
            const json = JSON.stringify(obj);
            if (json.length <= CHUNK_SIZE) {
                socket.send(json);
                return;
            }
            const cid = Math.random().toString(36).slice(2, 10);
            const n = Math.ceil(json.length / CHUNK_SIZE);
            for (let i = 0; i < n; i++) {
                const chunk = { type: "chunk", from: myId, cid, i, n,
                                data: json.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE) };
                if (obj.to !== undefined) chunk.to = obj.to;
                socket.send(JSON.stringify(chunk));
            }
        }

        // Returns the full message once every chunk has arrived, else null
        function collectChunk(msg) {
            const key = msg.from + ":" + msg.cid;
            const entry = incomingChunks[key] || (incomingChunks[key] = { parts: [], received: 0 });
            if (entry.parts[msg.i] === undefined) {
                entry.parts[msg.i] = msg.data;
                entry.received++;
            }
            if (entry.received < msg.n) return null;
            delete incomingChunks[key];
            try { return JSON.parse(entry.parts.join("")); } catch (e) { return null; }
        }

        function formatTime(ms) {
            return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
        }

        function updateClock() {
            $("clock").textContent = formatTime(Date.now());
        }

        // ==============================
        // VIDEO TILES
        // ==============================
        function createTile(id, name, isSelf, picture) {
            const tile = document.createElement("div");
            tile.className = "tile" + (isSelf ? " self" : "");
            tile.dataset.id = id;

            const video = document.createElement("video");
            video.autoplay = true;
            video.playsInline = true;
            if (isSelf) video.muted = true; // never play back our own audio

            const avatar = document.createElement("div");
            avatar.className = "avatar";
            const initial = document.createElement("span");
            initial.textContent = (name || "?").charAt(0);
            avatar.appendChild(initial);
            const pic = document.createElement("img");
            pic.alt = "";
            pic.referrerPolicy = "no-referrer"; // Google avatar URLs reject some referrers
            pic.onerror = () => pic.removeAttribute("src");
            avatar.appendChild(pic);

            const label = document.createElement("div");
            label.className = "label";
            const micOff = document.createElement("span");
            micOff.className = "mic-off";
            micOff.innerHTML = ICONS.micOffSmall;
            const nameSpan = document.createElement("span");
            nameSpan.className = "name";
            nameSpan.textContent = isSelf ? name + " (You)" : name;
            label.appendChild(micOff);
            label.appendChild(nameSpan);

            tile.appendChild(video);
            tile.appendChild(avatar);
            tile.appendChild(label);
            $("grid").appendChild(tile);
            setTilePicture(tile, picture);
            layoutGrid();
            return tile;
        }

        function setTileName(tile, name) {
            tile.querySelector(".name").textContent = name;
            tile.querySelector(".avatar span").textContent = (name || "?").charAt(0);
        }

        // Only Google and GitHub profile photos are shown, so a peer can't inject arbitrary URLs
        function setTilePicture(tile, picture) {
            const img = tile.querySelector(".avatar img");
            if (Core.isAllowedPicture(picture)) img.src = picture;
            else img.removeAttribute("src");
        }

        function setTileMedia(tile, audio, video) {
            tile.classList.toggle("audio-off", !audio);
            tile.classList.toggle("video-off", !video);
        }

        function layoutGrid() {
            const n = $("grid").children.length;
            const cols = n <= 1 ? 1 : n <= 4 ? 2 : n <= 9 ? 3 : 4;
            $("grid").style.setProperty("--cols", cols);
        }

        // ==============================
        // MEDIA
        // ==============================
        async function getLocalMedia() {
            try {
                return await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            } catch (e) {
                try {
                    return await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (e2) {
                    return null;
                }
            }
        }

        function hasTrack(kind) {
            return !!(localStream && localStream.getTracks().some(t => t.kind === kind));
        }

        function renderToggle(btn, on, onIcon, offIcon, what) {
            btn.innerHTML = on ? onIcon : offIcon;
            btn.classList.toggle("off", !on);
            btn.title = (on ? "Turn off " : "Turn on ") + what;
        }

        // Keeps the join-screen and call-bar buttons in sync
        function updateControlButtons() {
            ["micBtn", "previewMicBtn"].forEach(id =>
                renderToggle($(id), audioOn, ICONS.micOn, ICONS.micOff, "microphone"));
            ["camBtn", "previewCamBtn"].forEach(id =>
                renderToggle($(id), videoOn, ICONS.camOn, ICONS.camOff, "camera"));
            $("shareBtn").classList.toggle("active", !!screenStream);
            $("shareBtn").title = screenStream ? "Stop presenting" : "Present now";
        }

        function broadcastMediaState() {
            send({ type: "media", audio: audioOn, video: videoOn || !!screenStream });
        }

        function toggleMic() {
            if (!hasTrack("audio")) return toast("No microphone available");
            audioOn = !audioOn;
            localStream.getAudioTracks().forEach(t => t.enabled = audioOn);
            applyMediaState();
        }

        function toggleCam() {
            if (!hasTrack("video")) return toast("No camera available");
            videoOn = !videoOn;
            localStream.getVideoTracks().forEach(t => t.enabled = videoOn);
            applyMediaState();
        }

        // Before joining there is no self tile or peers, only the preview
        function applyMediaState() {
            updateControlButtons();
            if (!inCall) return updatePreviewMsg();
            setTileMedia(peers.self.tile, audioOn, videoOn || !!screenStream);
            broadcastMediaState();
        }

        // Swap the outgoing video track on every peer connection
        function replaceVideoTrack(track) {
            Object.keys(peers).forEach(id => {
                const p = peers[id];
                if (!p.pc) return;
                p.pc.getTransceivers().forEach(tr => {
                    if (tr.receiver.track && tr.receiver.track.kind === "video") {
                        tr.sender.replaceTrack(track).catch(() => {});
                    }
                });
            });
        }

        async function toggleShare() {
            if (screenStream) return stopShare();
            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                return toast(window.isSecureContext ? "Screen sharing is not supported"
                                                    : "Screen sharing needs localhost or HTTPS");
            }
            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            } catch (e) {
                return; // user cancelled
            }
            const track = screenStream.getVideoTracks()[0];
            track.onended = stopShare;
            replaceVideoTrack(track);
            const selfTile = peers.self.tile;
            selfTile.classList.add("screen");
            selfTile.querySelector("video").srcObject = screenStream;
            setTileMedia(selfTile, audioOn, true);
            updateControlButtons();
            broadcastMediaState();
            toast("You are presenting to everyone");
        }

        function stopShare() {
            if (!screenStream) return;
            screenStream.getTracks().forEach(t => t.stop());
            screenStream = null;
            const camTrack = localStream ? localStream.getVideoTracks()[0] || null : null;
            replaceVideoTrack(camTrack);
            const selfTile = peers.self.tile;
            selfTile.classList.remove("screen");
            selfTile.querySelector("video").srcObject = localStream;
            setTileMedia(selfTile, audioOn, videoOn);
            updateControlButtons();
            broadcastMediaState();
        }

        // ==============================
        // WEBRTC PEERS
        // ==============================
        function getOrCreatePeer(id, name, picture) {
            let p = peers[id];
            if (p && p.pc) {
                if (name && name !== p.name) { p.name = name; setTileName(p.tile, name); }
                if (picture) setTilePicture(p.tile, picture);
                return p;
            }

            const pc = new RTCPeerConnection(RTC_CONFIG);
            p = peers[id] = {
                pc,
                name: name || "Guest",
                tile: createTile(id, name || "Guest", false, picture),
                pendingIce: [],
                remoteStream: new MediaStream()
            };
            p.tile.querySelector("video").srcObject = p.remoteStream;

            pc.onicecandidate = (e) => {
                if (e.candidate) send({ type: "ice", to: id, candidate: e.candidate });
            };

            // srcObject was set once above; resetting it per track restarts playback
            pc.ontrack = (e) => {
                p.remoteStream.addTrack(e.track);
                playRemote(p.tile.querySelector("video"));
            };

            // One ICE restart before giving up: a network change or a NAT that
            // dropped the path can often be fixed by gathering new candidates.
            pc.oniceconnectionstatechange = () => {
                if (pc.iceConnectionState !== "failed") return;
                if (p.restarted) {
                    toast("Couldn't connect to " + p.name + ". A TURN server may be needed.");
                    return removePeer(id);
                }
                p.restarted = true;
                if (p.isOfferer) {
                    pc.restartIce();
                    sendOffer(id, p).catch(err => console.error("ICE restart failed", err));
                }
            };

            return p;
        }

        // Phones block audio that starts without a tap; offer a button instead of silence
        function playRemote(video) {
            video.play().catch(() => $("audioUnlock").classList.remove("hidden"));
        }

        function unlockAudio() {
            $("audioUnlock").classList.add("hidden");
            document.querySelectorAll(".tile:not(.self) video").forEach(playRemote);
        }

        // Closes a peer without telling the user (used for glare and reconnects)
        function dropPeer(id) {
            const p = peers[id];
            if (!p || id === "self") return;
            try { p.pc.close(); } catch (e) {}
            p.tile.remove();
            delete peers[id];
            layoutGrid();
        }

        // Attach our outgoing tracks (or recv-only slots if we have no device).
        // Runs once per connection: adding a track twice throws.
        function addLocalTracks(p, isOfferer) {
            if (p.tracksAdded) return;
            p.tracksAdded = true;
            const pc = p.pc;
            const videoTrack = screenStream
                ? screenStream.getVideoTracks()[0]
                : (localStream ? localStream.getVideoTracks()[0] : null);
            const audioTrack = localStream ? localStream.getAudioTracks()[0] : null;
            const streamForTracks = localStream || new MediaStream();

            if (audioTrack) pc.addTrack(audioTrack, streamForTracks);
            else if (isOfferer) pc.addTransceiver("audio", { direction: "recvonly" });

            if (videoTrack) pc.addTrack(videoTrack, streamForTracks);
            else if (isOfferer) pc.addTransceiver("video", { direction: "recvonly" });
        }

        async function flushIce(p) {
            while (p.pendingIce.length) {
                const c = p.pendingIce.shift();
                try { await p.pc.addIceCandidate(c); } catch (e) { console.warn("ICE error", e); }
            }
        }

        async function sendOffer(id, p) {
            const offer = await p.pc.createOffer();
            await p.pc.setLocalDescription(offer);
            send({
                type: "offer", to: id, name: myName, picture: myPicture, sdp: p.pc.localDescription,
                audio: audioOn, video: videoOn || !!screenStream
            });
        }

        // An existing participant calls the newcomer
        async function callPeer(id, name, audio, video, picture) {
            if (peers[id] && peers[id].pc) return; // already connected or connecting
            const p = getOrCreatePeer(id, name, picture);
            p.isOfferer = true;
            setTileMedia(p.tile, audio, video);
            addLocalTracks(p, true);
            await sendOffer(id, p);
        }

        async function handleOffer(msg) {
            const existing = peers[msg.from];
            // Glare: both sides sent an offer at once. The lower ID keeps its
            // offer; the higher ID drops its own and answers instead.
            if (existing && existing.pc && existing.pc.signalingState === "have-local-offer") {
                if (Number(myId) < Number(msg.from)) return;
                dropPeer(msg.from);
            }
            const p = getOrCreatePeer(msg.from, msg.name, msg.picture);
            setTileMedia(p.tile, msg.audio, msg.video);
            await p.pc.setRemoteDescription(msg.sdp);
            addLocalTracks(p, false);
            await flushIce(p);
            const answer = await p.pc.createAnswer();
            await p.pc.setLocalDescription(answer);
            send({
                type: "answer", to: msg.from, name: myName, picture: myPicture, sdp: p.pc.localDescription,
                audio: audioOn, video: videoOn || !!screenStream
            });
        }

        async function handleAnswer(msg) {
            const p = peers[msg.from];
            if (!p || !p.pc) return;
            if (msg.name) setTileName(p.tile, msg.name), p.name = msg.name;
            if (msg.picture) setTilePicture(p.tile, msg.picture);
            setTileMedia(p.tile, msg.audio, msg.video);
            await p.pc.setRemoteDescription(msg.sdp);
            await flushIce(p);
        }

        async function handleIce(msg) {
            const p = peers[msg.from];
            if (!p || !p.pc) return;
            if (p.pc.remoteDescription) {
                try { await p.pc.addIceCandidate(msg.candidate); } catch (e) { console.warn("ICE error", e); }
            } else {
                p.pendingIce.push(msg.candidate);
            }
        }

        function removePeer(id) {
            const p = peers[id];
            if (!p || id === "self") return;
            try { p.pc.close(); } catch (e) {}
            p.tile.remove();
            delete peers[id];
            layoutGrid();
            if (inCall) addSystemMessage(p.name + " left the call");
        }

        // ==============================
        // CHAT
        // ==============================
        function addChatMessage(name, text, time, mine) {
            const log = $("chatLog");
            const el = document.createElement("div");
            el.className = "msg";
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = mine ? "You" : name;
            const t = document.createElement("time");
            t.textContent = formatTime(time);
            meta.appendChild(t);
            const body = document.createElement("div");
            body.className = "text";
            body.textContent = text;
            el.appendChild(meta);
            el.appendChild(body);
            log.appendChild(el);
            log.scrollTop = log.scrollHeight;

            if (!mine && $("chatPanel").classList.contains("hidden")) {
                setUnread(true);
                toast(name + ": " + text);
            }
        }

        function addSystemMessage(text) {
            const log = $("chatLog");
            const el = document.createElement("div");
            el.className = "msg system";
            el.textContent = text;
            log.appendChild(el);
            log.scrollTop = log.scrollHeight;
        }

        function setUnread(value) {
            unread = value;
            const btn = $("chatBtn");
            let badge = btn.querySelector(".badge");
            if (value && !badge) {
                badge = document.createElement("span");
                badge.className = "badge";
                btn.appendChild(badge);
            } else if (!value && badge) {
                badge.remove();
            }
        }

        function toggleChat(force) {
            const panel = $("chatPanel");
            const show = typeof force === "boolean" ? force : panel.classList.contains("hidden");
            panel.classList.toggle("hidden", !show);
            $("chatBtn").classList.toggle("active", show);
            if (show) {
                setUnread(false);
                $("chatInput").focus();
            }
        }

        function sendChat(e) {
            e.preventDefault();
            const input = $("chatInput");
            const text = input.value.trim();
            if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;
            const time = Date.now();
            send({ type: "chat", name: myName, text, time });
            addChatMessage(myName, text, time, true);
            input.value = "";
            $("chatSend").disabled = true;
        }

        // ==============================
        // WEBSOCKET
        // ==============================
        // Every change to the connection status goes through here (see docs/state-machines.md)
        function setConn(event) {
            conn = Core.connTransition(conn, event);
            renderConn();
        }

        function renderConn() {
            const text = {
                [Core.CONN.CONNECTING]: "Connecting to server...",
                [Core.CONN.OPEN]: "Connected to " + wsUrl,
                [Core.CONN.RECONNECTING]: "Connection lost. Reconnecting...",
                [Core.CONN.CLOSED]: "Disconnected from server"
            }[conn];
            $("connStatus").textContent = text;
            updateJoinButton();
        }

        function startHeartbeat() {
            lastPong = Date.now();
            clearInterval(pingTimer);
            pingTimer = setInterval(() => {
                // No pong for a minute: the socket is dead even if the browser hasn't noticed
                if (Date.now() - lastPong > PONG_TIMEOUT_MS) return handleLost();
                if (socket && socket.readyState === WebSocket.OPEN) socket.send("__ping__");
            }, PING_MS);
        }

        // The server forgot us, so drop every peer; they'll reconnect when we re-join
        function handleLost() {
            clearInterval(pingTimer);
            if (socket) {
                socket.onclose = socket.onmessage = socket.onerror = null;
                try { socket.close(); } catch (e) {}
            }
            myId = null;
            $("chatSend").disabled = true;
            if (conn === Core.CONN.CLOSED) return;
            if (conn !== Core.CONN.RECONNECTING) {
                setConn("lost");
                if (inCall) {
                    Object.keys(peers).forEach(dropPeer);
                    toast("Connection lost. Reconnecting...");
                }
            }
            setTimeout(connect, Core.reconnectDelay(reconnectAttempt++));
        }

        function connect() {
            if (conn === Core.CONN.CLOSED) return;
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                reconnectAttempt = 0;
                setConn("opened");
                startHeartbeat();
            };

            socket.onmessage = (event) => {
                const data = String(event.data);

                // Plain-text control messages from app.bzg
                if (data === "__pong__") {
                    lastPong = Date.now();
                    return;
                }
                if (data.startsWith("__id__:")) {
                    myId = data.slice(7).trim();
                    updateJoinButton();
                    if (inCall) enterRoom(); // reconnected mid-call: re-join with the new ID
                    return;
                }
                if (data.startsWith("__left__:")) {
                    removePeer(data.slice(9).trim());
                    return;
                }

                let msg;
                try { msg = JSON.parse(data); } catch (e) { return; }
                if (!msg || !msg.type) return;
                if (String(msg.from) === String(myId)) return;          // our own echo
                if (msg.to !== undefined && String(msg.to) !== String(myId)) return; // not for us
                if (!inCall) return;

                if (msg.type === "chunk") {
                    msg = collectChunk(msg);
                    if (!msg) return;
                }

                // One message at a time, so an offer, its answer and ICE for the
                // same peer never run interleaved
                signalQueue = signalQueue
                    .then(() => handleMessage(msg))
                    .catch(err => console.error("Signaling error", err));
            };

            socket.onclose = handleLost;
        }

        // Tell the server our room, then announce ourselves to it
        function enterRoom() {
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send("__room__:" + room);
            send({ type: "join", name: myName, picture: myPicture, audio: audioOn, video: videoOn || !!screenStream });
            $("chatSend").disabled = $("chatInput").value.trim().length === 0;
        }

        async function handleMessage(msg) {
            const from = String(msg.from);
            switch (msg.type) {
                case "join":
                    addSystemMessage(msg.name + " joined the call");
                    toast(msg.name + " joined");
                    await callPeer(from, msg.name, msg.audio, msg.video, msg.picture);
                    break;
                case "offer":
                    await handleOffer(msg);
                    break;
                case "answer":
                    await handleAnswer(msg);
                    break;
                case "ice":
                    await handleIce(msg);
                    break;
                case "media":
                    if (peers[from]) setTileMedia(peers[from].tile, msg.audio, msg.video);
                    break;
                case "chat":
                    addChatMessage(msg.name, msg.text, msg.time || Date.now(), false);
                    break;
                case "leave":
                    removePeer(from);
                    break;
            }
        }

        // ==============================
        // GOOGLE SIGN-IN (OAuth 2.0 / OpenID Connect via Google Identity Services)
        // ==============================
        const CLIENT_ID = CONFIG.googleClientId || "";
        const GITHUB_AUTH_URL = CONFIG.githubAuthUrl || "";
        const SESSION_KEY = "jmeet.user";
        const GOOGLE_ISSUERS = ["accounts.google.com", "https://accounts.google.com"];
        const googleConfigured = () => !!CLIENT_ID && !CLIENT_ID.startsWith("YOUR_");
        const currentUser = () => auth.status === Core.AUTH.SIGNED_IN ? auth.user : null;

        // Decodes the payload of a Google ID token (a JWT: header.payload.signature)
        function decodeJwt(token) {
            const part = String(token).split(".")[1];
            if (!part) throw new Error("Malformed token");
            const b64 = part.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(part.length / 4) * 4, "=");
            const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
            return JSON.parse(new TextDecoder().decode(bytes));
        }

        // The Bonezegei server can't call Google to verify the signature, so the
        // browser checks the claims that matter: audience, issuer and expiry.
        function validateClaims(claims) {
            if (claims.aud !== CLIENT_ID) throw new Error("Token was issued for a different app");
            if (!GOOGLE_ISSUERS.includes(claims.iss)) throw new Error("Token was not issued by Google");
            if (!claims.exp || claims.exp * 1000 <= Date.now()) throw new Error("Token has expired");
            if (claims.email && claims.email_verified === false) throw new Error("Google email is not verified");
        }

        function handleCredential(response) {
            try {
                const claims = decodeJwt(response.credential);
                validateClaims(claims);
                if (currentUser()) setUser(null);
                setUser({
                    provider: "google",
                    name: claims.name || claims.email,
                    email: claims.email || "",
                    picture: Core.isAllowedPicture(claims.picture) ? claims.picture : "",
                    exp: claims.exp
                });
                toast("Signed in as " + (claims.name || claims.email));
            } catch (e) {
                console.error("Google sign-in failed", e);
                $("authMsg").textContent = "Sign-in failed: " + e.message;
            }
        }

        // Signing in or out always goes through Core.authTransition
        function setUser(profile) {
            auth = Core.authTransition(auth, profile ? { type: "signIn", user: profile } : { type: "signOut" });
            try {
                if (profile) sessionStorage.setItem(SESSION_KEY, JSON.stringify(profile));
                else sessionStorage.removeItem(SESSION_KEY);
            } catch (e) { /* storage blocked: stay signed in for this page only */ }
            renderAuth();
        }

        function restoreUser() {
            try {
                const saved = JSON.parse(sessionStorage.getItem(SESSION_KEY) || "null");
                if (Core.isValidUser(saved)) auth = { status: Core.AUTH.SIGNED_IN, user: saved };
                else sessionStorage.removeItem(SESSION_KEY);
            } catch (e) { /* bad saved value: stay signed out */ }
        }

        // The GitHub helper (scripts/github-auth.js) sends the profile back in the URL hash
        function readGitHubRedirect() {
            const hash = location.hash;
            if (!/[#&]auth(_error)?=/.test(hash)) return;
            const result = Core.parseAuthFragment(hash);
            if (result) {
                if (currentUser()) setUser(null);
                setUser(result.user);
                if (result.room) room = result.room;
                toast("Signed in as " + result.user.name);
            } else {
                const params = new URLSearchParams(hash.slice(1));
                room = Core.roomFromHash(params.get("room")) || room;
                $("authMsg").textContent = params.get("auth_error") === "denied"
                    ? "GitHub sign-in was cancelled."
                    : "GitHub sign-in failed. Please try again.";
            }
            history.replaceState(null, "", location.pathname + (room ? "#" + room : ""));
        }

        function signOut() {
            const user = currentUser();
            if (!user) return;
            if (user.provider === "google" && window.google && google.accounts) google.accounts.id.disableAutoSelect();
            setUser(null);
        }

        function renderAuth() {
            const user = currentUser();
            $("userChip").classList.toggle("hidden", !user);
            $("googleBtn").classList.toggle("hidden", !!user);
            $("githubBtn").classList.toggle("hidden", !!user || !GITHUB_AUTH_URL);
            if (user) {
                $("userName").textContent = user.name;
                $("userEmail").textContent = user.email;
                if (user.picture) $("userPic").src = user.picture;
                else $("userPic").removeAttribute("src");
                $("authMsg").textContent = "Signed in with " + (user.provider === "github" ? "GitHub" : "Google");
            } else if (googleConfigured() || GITHUB_AUTH_URL) {
                const names = [googleConfigured() && "Google", GITHUB_AUTH_URL && "GitHub"].filter(Boolean);
                $("authMsg").textContent = "Sign in with " + names.join(" or ") + " to join.";
            } else {
                $("authMsg").textContent = "Sign-in is not configured. Copy public/config.example.js to " +
                    "public/config.js and add your Google client ID or GitHub helper URL.";
            }
            updateJoinButton();
        }

        function updateJoinButton() {
            $("joinBtn").disabled = !(currentUser() && myId && conn === Core.CONN.OPEN);
        }

        // The room goes along so the helper can send people back to it
        function startGitHubSignIn(e) {
            e.preventDefault();
            const code = Core.normalizeRoomInput($("roomInput").value);
            location.href = GITHUB_AUTH_URL + (code ? "?room=" + encodeURIComponent(code) : "");
        }

        function initGoogleSignIn() {
            if (!googleConfigured()) return;
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredential,
                auto_select: false,
                cancel_on_tap_outside: true
            });
            google.accounts.id.renderButton($("googleBtn"), {
                theme: "outline", size: "large", shape: "pill", text: "signin_with", width: 280
            });
        }

        function loadGoogleSignIn() {
            if (window.google && google.accounts && google.accounts.id) return initGoogleSignIn();
            const script = $("gsiScript");
            script.addEventListener("load", initGoogleSignIn);
            script.addEventListener("error", () => {
                $("authMsg").textContent = "Could not load Google sign-in. Check your internet connection.";
            });
        }

        // ==============================
        // JOIN / LEAVE
        // ==============================
        async function initPreview() {
            localStream = await getLocalMedia();
            if (localStream) $("previewVideo").srcObject = localStream;
            audioOn = hasTrack("audio");
            videoOn = hasTrack("video");
            updatePreviewMsg();
            updateControlButtons();
        }

        function updatePreviewMsg() {
            let text = "";
            if (!localStream) {
                text = window.isSecureContext
                    ? "Camera and microphone are unavailable. You can still join and chat."
                    : "The browser blocks the camera on plain http:// (except localhost). " +
                      "You can still join, see others and chat.";
            } else if (!hasTrack("video")) {
                text = "Camera is unavailable (microphone only).";
            } else if (!videoOn) {
                text = "Camera is off";
            }
            const msg = $("previewMsg");
            msg.textContent = text;
            msg.classList.toggle("hidden", !text);
        }

        // ==============================
        // ROOMS
        // ==============================
        const randomInt = (n) => crypto.getRandomValues(new Uint32Array(1))[0] % n;

        function showRoomError(show) {
            const input = $("roomInput");
            $("roomError").classList.toggle("hidden", !show);
            input.setAttribute("aria-invalid", show ? "true" : "false");
            // Only point at the error while it's shown, so it isn't read out early
            if (show) input.setAttribute("aria-describedby", "roomError");
            else input.removeAttribute("aria-describedby");
        }

        function newRoom() {
            $("roomInput").value = Core.makeRoomCode(randomInt);
            showRoomError(false);
        }

        async function copyRoomLink() {
            const link = location.origin + location.pathname + "#" + room;
            try {
                await navigator.clipboard.writeText(link);
                toast("Link copied");
            } catch (e) {
                toast("Copy failed. Share this link: " + link);
            }
        }

        function joinCall() {
            const user = currentUser();
            if (inCall || !user || !myId) return;
            const code = Core.normalizeRoomInput($("roomInput").value);
            if (!code) {
                showRoomError(true);
                return $("roomInput").focus();
            }
            if (user.exp * 1000 <= Date.now()) {
                signOut();
                return toast("Your sign-in expired. Please sign in again.");
            }
            room = code;
            history.replaceState(null, "", location.pathname + "#" + room);
            myName = user.name;
            myPicture = user.picture;
            inCall = true;

            $("joinScreen").classList.add("hidden");
            $("siteFooter").classList.add("hidden");
            $("callScreen").classList.remove("hidden");
            $("roomCode").textContent = room;
            document.title = room + " | Jmeet";

            // Our own tile
            const selfTile = createTile("self", myName, true, myPicture);
            selfTile.querySelector("video").srcObject = localStream;
            peers.self = { tile: selfTile, name: myName };
            setTileMedia(selfTile, audioOn, videoOn);
            updateControlButtons();
            $("chatSend").disabled = true;

            addSystemMessage("You joined " + room);
            enterRoom();
        }

        function leaveCall() {
            send({ type: "leave" });
            inCall = false;
            setConn("close");
            clearInterval(pingTimer);
            Object.keys(peers).forEach(id => { if (id !== "self") removePeer(id); });
            if (screenStream) screenStream.getTracks().forEach(t => t.stop());
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (socket) { socket.onclose = null; socket.close(); }
            const footer = $("siteFooter");
            footer.classList.remove("hidden");
            document.title = "You left | Jmeet";
            // Reload keeps the #room hash, so Rejoin lands back in the same room
            document.body.innerHTML =
                '<main class="center-screen">' +
                '<span class="brand">' + ICONS.logo + '<b>Jmeet</b></span>' +
                '<h1>You left the meeting</h1>' +
                '<button class="pill-btn" type="button" onclick="location.reload()">Rejoin</button>' +
                '</main>';
            document.body.appendChild(footer);
        }

        // ==============================
        // THEME (System / Light / Dark)
        // ==============================
        const THEME_KEY = "jmeet.theme";

        function applyTheme(choice) {
            const theme = Core.parseTheme(choice);
            if (theme === "system") delete document.documentElement.dataset.theme;
            else document.documentElement.dataset.theme = theme;
            try {
                if (theme === "system") localStorage.removeItem(THEME_KEY);
                else localStorage.setItem(THEME_KEY, theme);
            } catch (e) { /* storage blocked: the theme still applies to this page */ }
            document.querySelectorAll("[data-theme-choice]").forEach(btn =>
                btn.setAttribute("aria-pressed", String(btn.dataset.themeChoice === theme)));
        }

        function initTheme() {
            let saved = null;
            try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
            document.querySelectorAll("[data-theme-choice]").forEach(btn => {
                btn.setAttribute("aria-pressed", String(btn.dataset.themeChoice === Core.parseTheme(saved)));
                btn.addEventListener("click", () => applyTheme(btn.dataset.themeChoice));
            });
            // Another tab changed the theme
            window.addEventListener("storage", (e) => { if (e.key === THEME_KEY) applyTheme(e.newValue); });
        }

        // ==============================
        // WIRE UP UI
        // ==============================
        $("joinBtn").addEventListener("click", joinCall);
        $("signOutBtn").addEventListener("click", signOut);
        $("githubBtn").addEventListener("click", startGitHubSignIn);
        $("newRoomBtn").addEventListener("click", newRoom);
        $("copyLinkBtn").addEventListener("click", copyRoomLink);
        $("audioUnlock").addEventListener("click", unlockAudio);
        $("roomInput").addEventListener("input", () => {
            if ($("roomInput").getAttribute("aria-invalid") === "true" &&
                Core.normalizeRoomInput($("roomInput").value)) showRoomError(false);
        });
        $("roomInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !$("joinBtn").disabled) joinCall(); });
        $("micBtn").addEventListener("click", toggleMic);
        $("camBtn").addEventListener("click", toggleCam);
        $("previewMicBtn").addEventListener("click", toggleMic);
        $("previewCamBtn").addEventListener("click", toggleCam);
        $("shareBtn").addEventListener("click", toggleShare);
        $("leaveBtn").addEventListener("click", leaveCall);
        $("chatBtn").addEventListener("click", () => toggleChat());
        $("chatClose").addEventListener("click", () => toggleChat(false));
        $("chatForm").addEventListener("submit", sendChat);
        $("chatInput").addEventListener("input", () => {
            $("chatSend").disabled = $("chatInput").value.trim().length === 0;
        });
        window.addEventListener("beforeunload", () => { if (inCall) send({ type: "leave" }); });

        $("brand").innerHTML = ICONS.logo + "<b>Jmeet</b>";
        $("shareBtn").innerHTML = ICONS.share;
        $("leaveBtn").innerHTML = ICONS.leave;
        $("chatBtn").innerHTML = ICONS.chat;
        updateControlButtons();
        updateClock();
        setInterval(updateClock, 15000);

        initTheme();
        room = Core.roomFromHash(location.hash);
        restoreUser();
        readGitHubRedirect();
        $("roomInput").value = room;
        renderAuth();
        loadGoogleSignIn();
        initPreview();
        connect();
    </script>
</body>
</html>
