name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No npm dependencies or lockfile: the "http" module is a Bonezegei
      # native DLL from bzg install (Windows only), so CI only runs the JS checks.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Syntax checks
        run: npm test
